name: Deploy Gridiron Edge
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gridiron-edge-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install and validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test tests/*.test.ts
          bun run build
          bun audit
      - name: Browser and accessibility audit
        run: |
          npm install --prefix "$RUNNER_TEMP/gridiron-qa" playwright@1.62.1 @axe-core/playwright@4.13.0 --no-audit --no-fund
          node "$RUNNER_TEMP/gridiron-qa/node_modules/playwright/cli.js" install --with-deps chromium
          SPAWN_QA_SERVER=1 PLAYWRIGHT_MODULE="$RUNNER_TEMP/gridiron-qa/node_modules/playwright" AXE_MODULE="$RUNNER_TEMP/gridiron-qa/node_modules/@axe-core/playwright" node scripts/qa-live.cjs
      - name: Install deployment tooling
        run: npm install --prefix "$RUNNER_TEMP/gridiron-tools" wrangler@4.131.1 --no-audit --no-fund
      - name: Provision, deploy and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_ACCESS_KEY: ${{ secrets.OWNER_ACCESS_KEY }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          APP_SLUG: ${{ vars.APP_SLUG }}
          HF_ENV: ${{ vars.HF_ENV }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/deploy-cloudflare.mjs
